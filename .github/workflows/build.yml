name: Build & Release for 32-bit Win 7/8.1

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'رقم الإصدار (Release Tag مثل v1.0.9-win32)'
        required: false
        default: 'v1.0.9-win32'
      release_title:
        description: 'عنوان الإصدار'
        required: false
        default: 'Ezoo Download v1.0.9 - 32-bit Windows Ready'

permissions:
  contents: write

jobs:
  build-win32:
    name: Build Ezoo Download (32-bit Compatible)
    runs-on: windows-2022

    steps:
      - name: 📥 استنساخ المستودع (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🦀 تثبيت بيئة Rust للـ 32-bit
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: ⚙️ إعداد بيئة ومكتبات البناء
        shell: bash
        run: |
          mkdir -p .cargo
          cat << 'CONF' > .cargo/config.toml
          [target.i686-pc-windows-msvc]
          rustflags = ["-C", "target-feature=+crt-static"]
          CONF

      - name: 📦 بناء التطبيق بصيغة Release للـ 32-bit
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          SLINT_BACKEND: "winit-software"
        run: |
          cargo build --release --target i686-pc-windows-msvc --bin EzooDownload

      - name: 🛠️ تجهيز ملفات التوزيع وحزمة التثبيت (Setup & Portable)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist, dist\portable | Out-Null
          
          # نسخ ملف exe المستقل مباشرة (من مسار i686)
          Copy-Item target\i686-pc-windows-msvc\release\EzooDownload.exe dist\EzooDownload.exe -Force
          Copy-Item target\i686-pc-windows-msvc\release\EzooDownload.exe dist\portable\EzooDownload.exe -Force
          
          if (Test-Path extension) {
            Copy-Item -Recurse extension dist\portable\ -Force
          }

          # إنشاء ملف تشغيل مساعد
          @"
          @echo off
          set SLINT_BACKEND=winit-software
          start "" "%~dp0EzooDownload.exe"
          "@ | Out-File -Encoding ASCII dist\portable\Run.bat

          # ضغط النسخة المحمولة
          Compress-Archive -Path dist\portable\* -DestinationPath dist\EzooDownload-Win32-Portable.zip -Force

      - name: 🚀 رفع النسخة النهائية تلقائياً إلى GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          name: ${{ github.event.inputs.release_title || 'Ezoo Download (32-bit Windows Portable)' }}
          tag_name: ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || github.event.inputs.release_tag || 'v1.0.9-win32' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🌟 إصدار Ezoo Download المتوافق مع 32-bit Windows
            
            - 🛡️ **نسخة EXE مستقلة (32-bit Standalone)**: مبنية خصيصاً لأنظمة 32-bit مع Static CRT.
            - 🎨 **مشغل الرسوميات البرمجي (Software Renderer)** مفعّل تلقائياً.
          files: |
            dist/EzooDownload.exe
            dist/EzooDownload-Win32-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
